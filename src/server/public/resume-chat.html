<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简历问答</title>
<script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #f8f9fa;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-muted: #6b7280;
    --primary: #2563eb;
    --primary-light: #eff6ff;
    --border: #e5e7eb;
    --user-bg: #2563eb;
    --user-text: #ffffff;
    --ai-bg: #f0f4ff;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #60a5fa;
      --primary-light: #1e3a5f;
      --border: #334155;
      --user-bg: #3b82f6;
      --ai-bg: #1e293b;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .nav-bar {
    display: flex; gap: 16px; padding: 12px 24px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    font-size: 0.9rem; align-items: center;
  }
  .nav-bar a { color: var(--text-muted); text-decoration: none; padding: 6px 16px; border-radius: 8px; }
  .nav-bar a:hover, .nav-bar a.active { background: var(--primary-light); color: var(--primary); }
  .nav-bar .title { font-weight: 600; margin-right: auto; }

  #chat-area {
    flex: 1; overflow-y: auto; padding: 24px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .message { max-width: 75%; padding: 12px 16px; border-radius: var(--radius);
    white-space: pre-wrap; word-wrap: break-word; line-height: 1.7; }
  .message.user {
    align-self: flex-end; background: var(--user-bg); color: var(--user-text);
    border-bottom-right-radius: 4px;
  }
  .message.ai {
    align-self: flex-start; background: var(--ai-bg); color: var(--text);
    border-bottom-left-radius: 4px;
    border: 1px solid var(--border);
  }
  .message.assistant {
    align-self: flex-start; background: var(--ai-bg); color: var(--text);
    border-bottom-left-radius: 4px;
    border: 1px solid var(--border);
  }
  .message.ai.streaming::after {
    content: "▊"; animation: blink 0.8s infinite;
  }
  .message.assistant.streaming::after {
    content: "▊"; animation: blink 0.8s infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  .suggestions-area {
    padding: 8px 24px 16px;
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  }
  .suggestion-btn {
    padding: 8px 18px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-muted); font-size: 0.85rem;
    cursor: pointer; transition: all 0.15s;
  }
  .suggestion-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }

  .input-area {
    display: flex; gap: 8px; padding: 16px 24px;
    border-top: 1px solid var(--border); background: var(--surface);
  }
  .input-area input {
    flex: 1; padding: 10px 16px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 0.9rem; outline: none;
    background: var(--bg); color: var(--text);
  }
  .input-area input:focus { border-color: var(--primary); }
  .input-area input:disabled { opacity: 0.5; }
  .input-area button {
    padding: 10px 24px; border-radius: 8px; border: none;
    background: var(--primary); color: #fff; font-size: 0.9rem;
    cursor: pointer; transition: opacity 0.15s; font-weight: 500;
  }
  .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
  .input-area button:hover:not(:disabled) { opacity: 0.9; }

  .placeholder {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: var(--text-muted); gap: 12px;
  }
  .placeholder .icon { font-size: 3rem; }
  .placeholder p { font-size: 0.95rem; }

  .error-msg { color: #dc2626; text-align: center; padding: 8px; font-size: 0.85rem; }

  /* Markdown rendering styles */
  .message .md { line-height: 1.7; }
  .message .md p { margin-bottom: 8px; }
  .message .md p:last-child { margin-bottom: 0; }
  .message .md ul, .message .md ol { margin: 6px 0; padding-left: 20px; }
  .message .md li { margin-bottom: 4px; }
  .message .md h1, .message .md h2, .message .md h3,
  .message .md h4, .message .md h5, .message .md h6 {
    margin: 14px 0 8px; font-weight: 600; line-height: 1.3;
  }
  .message .md h1 { font-size: 1.3rem; }
  .message .md h2 { font-size: 1.15rem; }
  .message .md h3 { font-size: 1.05rem; }
  .message .md h4 { font-size: 1rem; }
  .message .md code {
    background: rgba(0,0,0,0.08); padding: 2px 6px; border-radius: 4px;
    font-family: "Cascadia Code", "Fira Code", "JetBrains Mono", Consolas, monospace;
    font-size: 0.85em;
  }
  @media (prefers-color-scheme: dark) {
    .message .md code { background: rgba(255,255,255,0.1); }
  }
  .message .md pre {
    margin: 10px 0; border-radius: 8px; overflow-x: auto;
    background: #1e293b; border: 1px solid #334155;
  }
  .message .md pre code {
    display: block; padding: 14px 16px; background: transparent;
    font-size: 0.82rem; line-height: 1.5; color: #e2e8f0;
    border-radius: 0; white-space: pre;
  }
  .message .md blockquote {
    margin: 8px 0; padding: 6px 14px; border-left: 3px solid var(--primary);
    color: var(--text-muted); background: var(--primary-light);
    border-radius: 0 6px 6px 0;
  }
  .message .md table {
    border-collapse: collapse; margin: 8px 0; width: 100%;
    font-size: 0.85rem;
  }
  .message .md th, .message .md td {
    border: 1px solid var(--border); padding: 6px 10px; text-align: left;
  }
  .message .md th { background: rgba(0,0,0,0.04); font-weight: 600; }
  .message .md hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  .message .md a { color: var(--primary); text-decoration: underline; }
  .message .md a:hover { opacity: 0.8; }

  @media (max-width: 600px) {
    .message { max-width: 90%; }
    #chat-area { padding: 12px; }
    .suggestions-area { padding: 8px 12px 12px; }
    .input-area { padding: 12px; }
  }
</style>
</head>
<body>
<div class="nav-bar">
  <span class="title">🤖 简历AI问答</span>
  <a href="/">📄 文档</a>
  <a href="__WIKI_URL__" target="_blank">📚 Wiki ↗</a>
  <a href="/resume">👤 简历</a>
  <a href="/resume/chat" class="active">💬 问答</a>
  <a href="/api/logout?next=/login" onclick="sessionStorage.removeItem('navigate_token')">🚪 退出</a>
</div>

<div id="chat-area">
  <div class="placeholder">
    <div class="icon">👋</div>
    <p>欢迎！我可以回答关于你简历的任何问题。</p>
    <p style="font-size:0.85rem;">试试点击下面的推荐问题，或直接输入你的问题。</p>
  </div>
</div>

<div class="suggestions-area" id="suggestions"></div>

<div class="input-area">
  <input type="text" id="question-input" placeholder="输入你的问题..." autofocus>
  <button id="send-btn">发送 🚀</button>
</div>

<script>
const SUGGESTIONS = [
  "📋 介绍我的背景",
  "💡 我有哪些技能",
  "💼 我的工作经历",
  "🎓 我的教育背景",
  "🚀 我的项目经历",
  "🎯 我适合什么岗位",
  "📄 帮我写求职信",
  "📊 分析我的技能优势",
];

const urlToken = new URLSearchParams(location.search).get("token");
if (urlToken) sessionStorage.setItem("navigate_token", urlToken);
const TOKEN = sessionStorage.getItem("navigate_token");
if (!TOKEN) { location.href = "/login?next=" + encodeURIComponent(location.pathname + location.search); throw new Error("no token"); }
document.querySelectorAll(".nav-bar a").forEach(function(a) {
  var href = a.getAttribute("href");
  if (href && href.indexOf("token=") === -1 && href.indexOf("http") !== 0) a.setAttribute("href", href + "?token=" + TOKEN);
});
let loading = false;

const chatArea = document.getElementById("chat-area");
const input = document.getElementById("question-input");
const sendBtn = document.getElementById("send-btn");
const suggestionsEl = document.getElementById("suggestions");

// Render suggestion buttons
SUGGESTIONS.forEach(text => {
  const btn = document.createElement("button");
  btn.className = "suggestion-btn";
  btn.textContent = text;
  btn.addEventListener("click", () => ask(text));
  suggestionsEl.appendChild(btn);
});

input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
sendBtn.addEventListener("click", send);

// Load chat history for this token
async function loadHistory() {
  try {
    const res = await fetch(`/api/chat/history?token=${TOKEN}`);
    const data = await res.json();
    if (data.messages && data.messages.length > 0) {
      const placeholder = chatArea.querySelector(".placeholder");
      if (placeholder) placeholder.remove();
      for (const m of data.messages) {
        appendMessage(m.role === "assistant" ? "ai" : m.role, m.content);
      }
    }
  } catch { /* no history */ }
}
if (TOKEN) loadHistory();

/** Render markdown to sanitized HTML */
function renderMarkdown(text) {
  if (!text) return "";
  try {
    const html = marked.parse(text);
    return DOMPurify.sanitize(html);
  } catch {
    return text;
  }
}

async function send() {
  const q = input.value.trim();
  if (!q || loading) return;
  ask(q);
  input.value = "";
}

async function ask(question) {
  if (loading) return;
  loading = true;
  sendBtn.disabled = true;
  input.disabled = true;

  // Remove placeholder
  const placeholder = chatArea.querySelector(".placeholder");
  if (placeholder) placeholder.remove();

  // Add user message
  appendMessage("user", question);

  // Add AI message placeholder
  const aiMsgEl = appendMessage("ai", "", true);

  try {
    const res = await fetch(`/api/resume/chat?token=${TOKEN}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, sessionId: TOKEN }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: res.statusText }));
      throw new Error(err.error || "请求失败");
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let fullAnswer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop() || ""; // Keep incomplete line in buffer

      for (const line of lines) {
        if (line.startsWith("event: ")) {
          // event type line — skip, we handle by data
        } else if (line.startsWith("data: ")) {
          try {
            const payload = JSON.parse(line.slice(6));
            if (typeof payload === "string") {
              fullAnswer += payload;
              const mdEl = aiMsgEl.querySelector(".md");
              if (mdEl) mdEl.innerHTML = renderMarkdown(fullAnswer);
              chatArea.scrollTop = chatArea.scrollHeight;
            }
          } catch { /* ignore parse errors */ }
        }
      }
    }

    // Process remaining buffer
    if (buffer.startsWith("data: ")) {
      try {
        const payload = JSON.parse(buffer.slice(6));
        if (typeof payload === "string") {
          fullAnswer += payload;
          const mdEl = aiMsgEl.querySelector(".md");
          if (mdEl) mdEl.innerHTML = renderMarkdown(fullAnswer);
        }
      } catch { /* ignore */ }
    }

    aiMsgEl.classList.remove("streaming");

  } catch (err) {
    aiMsgEl.classList.remove("streaming");
    const mdEl = aiMsgEl.querySelector(".md");
    if (mdEl) mdEl.textContent = `❌ ${err.message}`;
    aiMsgEl.style.color = "#dc2626";
  }

  loading = false;
  sendBtn.disabled = false;
  input.disabled = false;
  input.focus();
  chatArea.scrollTop = chatArea.scrollHeight;
}

function appendMessage(role, content, streaming = false) {
  const el = document.createElement("div");
  el.className = `message ${role}`;
  if (streaming) el.classList.add("streaming");
  const md = document.createElement("div");
  md.className = "md";
  md.innerHTML = content ? renderMarkdown(content) : "";
  el.appendChild(md);
  chatArea.appendChild(el);
  chatArea.scrollTop = chatArea.scrollHeight;
  return el;
}
</script>
</body>
</html>
